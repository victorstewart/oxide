[package]
name = "oxide-web-comparison"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone browser product-comparison laboratory for Oxide"

[dependencies]
anyhow = "1"
oxide-benchmark-spec = { path = "../../crates/benchmark-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.98"
oxide-renderer-api = { path = "../../crates/renderer-api" }
oxide-renderer-web = { path = "../../crates/renderer-web" }
oxide-test-scenes = { path = "../../crates/test-scenes" }
oxide-text = { path = "../../crates/text" }
oxide-ui-core = { path = "../../crates/ui-core" }
png = "0.17"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
   "Document",
   "DomRect",
   "Element",
   "EventTarget",
   "HtmlCanvasElement",
   "KeyboardEvent",
   "Performance",
   "PointerEvent",
   "Response",
   "Window",
] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxide-web-comparison"
path = "src/main.rs"
