name: AppleComparison
options:
  deploymentTarget:
    iOS: 18.0
settings:
  base:
    SWIFT_VERSION: 5.0
schemes:
  CoreComparison:
    build:
      targets:
        OxideBenchIOS: all
        UIKitBenchIOS: all
targets:
  OxideBenchIOS:
    type: application
    platform: iOS
    sources:
      - path: Shared/ComparatorApp/TransportProbeAppDelegate.swift
      - path: Shared/ComparatorApp/CorePresentationProbe.swift
      - path: Oxide-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxide.comparison.oxidebenchios
        PRODUCT_NAME: OxideBenchIOS
        INFOPLIST_FILE: Oxide-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 18.0
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-lc++"
          - "-framework"
          - UIKit
          - "-framework"
          - Foundation
          - "-framework"
          - QuartzCore
          - "-framework"
          - Metal
          - "-framework"
          - CoreGraphics
          - "-framework"
          - UserNotifications
          - "-framework"
          - CoreLocation
          - "-framework"
          - AVFoundation
          - "-framework"
          - Contacts
          - "-framework"
          - CoreBluetooth
          - "-framework"
          - CoreMotion
          - "$(BUILT_PRODUCTS_DIR)/liboxide_comparison_runtime.a"
    prebuildScripts:
      - name: Build and Embed Comparison Runtime
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/liboxide_comparison_runtime.a"
        script: |
          set -euo pipefail
          REPO_ROOT="$(cd "${PROJECT_DIR}/../.." && pwd)"
          export CARGO_TARGET_DIR="${OBJROOT}/oxide-comparison-cargo/${PLATFORM_NAME}"
          TARGET_GUARD="${REPO_ROOT}/host/apple-comparison/scripts/guard-cargo-target.sh"
          case "${PLATFORM_NAME}" in
            iphoneos)
              RUST_TARGET="aarch64-apple-ios"
              ;;
            *)
              RUST_TARGET="aarch64-apple-ios-sim"
              ;;
          esac
          /bin/sh "${TARGET_GUARD}" "${CARGO_TARGET_DIR}" "${REPO_ROOT}/Cargo.toml"
          mkdir -p "${CARGO_TARGET_DIR}"
          HOST_LINKER_WRAPPER="${CARGO_TARGET_DIR}/xcode-host-clang.sh"
          cat > "${HOST_LINKER_WRAPPER}" <<'EOF'
          #!/bin/sh
          exec xcrun --sdk macosx clang "$@"
          EOF
          chmod +x "${HOST_LINKER_WRAPPER}"
          (cd "${REPO_ROOT}/host/apple-comparison/oxide-comparison-runtime" && \
             export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="${HOST_LINKER_WRAPPER}" && \
             unset SDKROOT SDK_DIR SDK_NAME IPHONEOS_DEPLOYMENT_TARGET && \
             export IPHONEOS_DEPLOYMENT_TARGET=18.0 && \
             cargo build --locked -p oxide-comparison-runtime --release --target "${RUST_TARGET}")
          /bin/sh "${TARGET_GUARD}" "${CARGO_TARGET_DIR}" "${REPO_ROOT}/Cargo.toml"
          mkdir -p "${BUILT_PRODUCTS_DIR}"
          cp -v "${CARGO_TARGET_DIR}/${RUST_TARGET}/release/liboxide_comparison_runtime.a" "${BUILT_PRODUCTS_DIR}/liboxide_comparison_runtime.a"
  UIKitBenchIOS:
    type: application
    platform: iOS
    sources:
      - path: Shared/ComparatorApp/TransportProbeAppDelegate.swift
      - path: Shared/ComparatorApp/CorePresentationProbe.swift
      - path: UIKit-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxide.comparison.uikitbenchios
        PRODUCT_NAME: UIKitBenchIOS
        INFOPLIST_FILE: UIKit-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 18.0
