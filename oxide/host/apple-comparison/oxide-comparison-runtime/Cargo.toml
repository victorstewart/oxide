[package]
name = "oxide-comparison-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
oxide-benchmark-spec = { path = "../../../crates/benchmark-spec" }
oxide-renderer-api = { path = "../../../crates/renderer-api" }
oxide-renderer-metal = { path = "../../../crates/renderer-metal" }
oxide-test-scenes = { path = "../../../crates/test-scenes", features = ["comparison-geometry"] }
oxide-text = { path = "../../../crates/text" }
oxide-timing = { path = "../../../crates/timing" }
oxide-ui-core = { path = "../../../crates/ui-core" }
png = "0.17"
serde = "1.0"
serde_json = "1.0"
