[package]
name = "oxide-host-ios"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Staticlib host bridge for iOS app"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
cc = "1.0"

[dependencies]
oxide-input = { path = "../../../crates/input" }
oxide-platform-ios = { path = "../../../crates/platform-ios", default-features = false, features = ["native-camera-bridge", "nametag-host-bridge"] }
oxide-perf-runner = { path = "../../../crates/perf-runner", optional = true }
oxide-renderer-metal = { path = "../../../crates/renderer-metal" }
oxide-renderer-api = { path = "../../../crates/renderer-api" }
oxide-ui-core = { path = "../../../crates/ui-core" }
oxide-test-scenes = { path = "../../../crates/test-scenes", optional = true }
oxide-timing = { path = "../../../crates/timing" }
oxide-text = { path = "../../../crates/text", optional = true }
oxide-permissions = { path = "../../../crates/permissions", optional = true }
oxide-platform-api = { path = "../../../crates/platform-api" }
oxide-networking = { path = "../../../crates/networking", optional = true }
oxide-telemetry = { path = "../../../crates/telemetry", optional = true }
png = { version = "0.17", optional = true }
libc = "0.2"
mach2 = "0.4"

[features]
default = []
ios-edr = []
tokio-runtime = ["oxide-platform-ios/tokio-runtime"]
perf-host-stubs = []
test-scenes-entrypoint = [
   "dep:oxide-networking",
   "dep:oxide-perf-runner",
   "dep:oxide-permissions",
   "dep:oxide-telemetry",
   "dep:oxide-test-scenes",
   "dep:oxide-text",
   "dep:png",
]
